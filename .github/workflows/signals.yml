name: Forex Signal Alerts

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r forex_bot/requirements.txt
      - name: Run signal alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ACCOUNT_CAPITAL: ${{ secrets.ACCOUNT_CAPITAL }}
          RISK_PERCENT: ${{ secrets.RISK_PERCENT }}
        run: python3 forex_bot/alert.py
      - name: Commit updated trade log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forex_bot/trades.json
          git diff --staged --quiet || git commit -m "Update trade log [skip ci]"
          git push
